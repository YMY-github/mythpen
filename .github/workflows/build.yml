name: Desktop preview builds

on:
  workflow_dispatch:
  push:
    branches: [feature/cloud-sync-preview]
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            artifact: Mythpen-Sync-macOS-ARM64
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-15-intel
            artifact: Mythpen-Sync-macOS-Intel
            target: x86_64-apple-darwin
          - name: Windows x64
            runner: windows-2022
            artifact: Mythpen-Sync-Windows-x64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check sync and application types
        run: |
          pnpm test:sync
          pnpm exec tsc --project tsconfig.app.json --noEmit
      - name: Compile packaged server and native credentials
        run: pnpm build:sidecar
      - name: Test packaged server
        run: pnpm test:sidecar
      - name: Build desktop installers
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
