[package]
name = "mythpen"
version = "0.0.11"
description = "AI 辅助小说创作工具"
authors = ["Nico"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# Use the native URL handler and propagate launch failures instead of silently
# detaching cmd.exe /c start. This also preserves the complete OAuth query.
open = { version = "=5.3.6", features = ["shellexecute-on-windows"] }
